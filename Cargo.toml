[package]
name = "taichichuan-mobi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
getrandom = { version = "0.4.3", default-features = false }
hmac = "0.13.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
maud = { version = "0.27.0", features = ["axum"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1.2.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tower-livereload = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
webpki-roots = "1.0.12"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

# Deny patterns that indicate bugs or incomplete code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async safety
await_holding_lock = "deny"
large_futures = "warn"

# Prevent suppressing lints with #[allow(...)]
allow_attributes = "deny"

[lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
