[package]
name = "taichichuan-mobi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower-livereload = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

# Deny patterns that indicate bugs or incomplete code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async safety
await_holding_lock = "deny"
large_futures = "warn"

# Prevent suppressing lints with #[allow(...)]
allow_attributes = "deny"

[lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
